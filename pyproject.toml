[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-ram-clean"
version = "1.0.0"
description = "Configurable Linux RAM, tmpfs, swap, and memory-pressure management daemon and CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "keep-ram-clean contributors" }]
requires-python = ">=3.9"
keywords = ["linux", "memory", "ram", "daemon", "systemd", "psi", "cgroup", "tmpfs", "swap"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]

[project.scripts]
keep-ram-clean = "keep_ram_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
