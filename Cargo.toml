[package]
name = "keep-ram-clean"
version = "2.3.1"
edition = "2021"
rust-version = "1.85"
description = "Configurable Linux RAM, tmpfs, swap, and memory-pressure management daemon and CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Andrew-Smith-93/keep-ram-clean"
keywords = ["linux", "memory", "ram", "daemon", "systemd"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "Andrew Smith <andrewsmith.independent@gmail.com>"
copyright = "2026, keep-ram-clean contributors"
license-file = ["LICENSE", "0"]
section = "admin"
priority = "optional"
conf-files = ["/etc/keep-ram-clean/config.toml"]
maintainer-scripts = "debian/"
assets = [
    ["target/release/keep-ram-clean", "usr/bin/", "755"],
    ["config/config.example.toml", "etc/keep-ram-clean/config.toml", "644"],
    ["debian/keep-ram-clean.service", "usr/lib/systemd/system/keep-ram-clean.service", "644"],
    ["debian/keep-ram-clean-user.service", "usr/lib/systemd/user/keep-ram-clean.service", "644"],
    ["debian/keep-ram-clean.1", "usr/share/man/man1/keep-ram-clean.1", "644"],
    ["debian/README.Debian", "usr/share/doc/keep-ram-clean/README.Debian", "644"],
]
