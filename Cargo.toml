[package]
name = "keep-ram-clean"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "Configurable Linux RAM, tmpfs, swap, and memory-pressure management daemon and CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Andrew-Smith-93/keep-ram-clean"
keywords = ["linux", "memory", "ram", "daemon", "systemd"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
