name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run unit & security tests
        run: cargo test --verbose
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release binary & smoke-test CLI
        run: |
          cargo build --release
          ./target/release/keep-ram-clean --version
          ./target/release/keep-ram-clean status --json > /dev/null
          ./target/release/keep-ram-clean doctor --json > /dev/null
          ./target/release/keep-ram-clean run --dry-run --json > /dev/null
